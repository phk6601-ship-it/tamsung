<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셜록 홈즈와 M의 수수께끼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Pen+Script&family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0c0f12;--ink:#231a12;--ink2:#5c4c3a;--paper:#f1e5c9;--paper2:#e3d1a8;--paper3:#d6bf8f;
  --brass:#b98a3e;--brass2:#e6c57c;--red:#a32a20;--red2:#c8443a;--green:#1f3b33;--gas:#f3c46a;
  --serif:'Nanum Myeongjo',serif;--sans:'Noto Sans KR',system-ui,sans-serif;--pen:'Nanum Pen Script',cursive;
  --type:'Special Elite','Nanum Myeongjo',monospace;--display:'Playfair Display','Nanum Myeongjo',serif;
}
*{box-sizing:border-box}
html{background:#07090b}
html,body{margin:0;min-height:100%}
body{min-height:100vh}
body{background:radial-gradient(ellipse at 50% -20%,#2b3236 0%,#141a1e 45%,#07090b 100%) fixed;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:var(--sans);cursor:pointer}
input{font-family:var(--sans)}

/* ---------- 분위기 레이어 ---------- */
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
.fog{position:fixed;left:-50%;width:200%;height:60vh;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 30% 60%,rgba(170,180,175,.13),transparent 60%),radial-gradient(ellipse at 75% 40%,rgba(170,180,175,.1),transparent 55%);animation:drift 60s linear infinite}
.fog.f1{bottom:-10vh}.fog.f2{bottom:20vh;animation-duration:90s;animation-direction:reverse;opacity:.7}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
#flash{position:fixed;inset:0;background:#dfe9f5;opacity:0;pointer-events:none;z-index:90}
#flash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}6%{opacity:.5}12%{opacity:.05}20%{opacity:.35}100%{opacity:0}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.55) 100%);animation:gaslight 7s ease-in-out infinite}
@keyframes gaslight{0%,100%{opacity:1}43%{opacity:.88}45%{opacity:1}47%{opacity:.9}}

#app{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:14px 14px 50px}

/* ---------- HUD ---------- */
.topbar{display:flex;align-items:center;gap:12px;background:linear-gradient(#2a2119,#1a140f);border:1.5px solid var(--brass);border-radius:6px;padding:9px 14px;color:var(--brass2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;user-select:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--brass2)}
.brand small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.18em;color:#a8936a}
.casechip{margin-left:auto;text-align:right}
.casechip small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.2em;color:#a8936a}
.casechip b{font-family:var(--sans);font-weight:900;font-size:19px;color:var(--brass2);letter-spacing:.06em}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.clockbar{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:rgba(20,15,11,.8);border:1px solid rgba(185,138,62,.55);border-radius:999px;padding:6px 14px;color:#eadbb8;font-family:var(--sans)}
.clockbar svg{width:22px;height:22px;flex:none}
.clockbar .lbl{font-size:12px;letter-spacing:.12em;color:#b9a47a;white-space:nowrap}
.clockbar .bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.clockbar .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8d6a2c,#e6c57c);transition:width 1s linear}
.clockbar.low .bar i{background:linear-gradient(90deg,#7a1d16,#d0533f)}
.clockbar.low b{color:#ff9d8a;animation:pulse 1s ease-in-out infinite}
.clockbar b{font-size:17px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.45}}
.tb{display:inline-flex;align-items:center;gap:6px;background:rgba(20,15,11,.85);border:1px solid rgba(185,138,62,.6);color:var(--brass2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;transition:background .2s,transform .1s}
.tb:hover{background:rgba(60,45,30,.95)}.tb:active{transform:scale(.97)}
.tb svg{width:16px;height:16px}
.tb[hidden]{display:none}
.tb .t{font-weight:400;color:#c7b48a;font-size:12px;font-variant-numeric:tabular-nums}
.tb.ready{background:linear-gradient(#f0d48a,#c99a45);color:var(--ink);border-color:#f0d48a;animation:glow 1.6s ease-in-out infinite}
.tb.ready .t{color:var(--ink)}
@keyframes glow{50%{box-shadow:0 0 16px 2px rgba(240,212,138,.7)}}

/* ---------- 사건 파일 ---------- */
.file{position:relative;margin-top:22px}
.file-tab{position:absolute;top:-17px;left:22px;background:#c9ab6e;color:var(--ink);font-family:var(--type);font-size:13px;letter-spacing:.14em;padding:5px 18px 8px;border-radius:8px 8px 0 0;box-shadow:0 -2px 6px rgba(0,0,0,.25)}
.paper{position:relative;background:
  radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 50%),
  radial-gradient(ellipse at 85% 90%,rgba(140,100,50,.18),transparent 55%),
  linear-gradient(#f3e8cd,#e9d9b3);border-radius:3px;padding:28px 30px 22px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 60px rgba(120,85,40,.18)}
.paper::before{content:'';position:absolute;inset:8px;border:1px solid rgba(120,90,50,.3);pointer-events:none}
.clip{position:absolute;top:-14px;right:46px;width:22px;height:62px;border:3.5px solid #8f949a;border-radius:11px;border-bottom-color:transparent;z-index:3}
.clip::after{content:'';position:absolute;left:3px;top:6px;width:9px;height:42px;border:3px solid #a9aeb4;border-radius:7px;border-top-color:transparent}
.place{font-family:var(--type);font-size:14px;letter-spacing:.08em;color:var(--red);display:flex;align-items:center;gap:6px}
.place svg{width:16px;height:16px}
.c-title{font-family:var(--serif);font-weight:800;font-size:clamp(26px,5vw,40px);margin:6px 0 8px;color:var(--ink);letter-spacing:-.01em;line-height:1.25}
.brief{font-size:17px;line-height:1.85;margin:0 0 16px;color:#3a2d20}
.brief em{font-style:normal;color:var(--red);font-weight:700}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(120,90,50,.5),transparent);margin:14px 0}
.q{font-family:var(--serif);font-weight:800;font-size:clamp(18px,3.2vw,22px);text-align:center;margin:18px 0 6px;color:var(--ink);line-height:1.6}
.q small{display:block;font-family:var(--sans);font-weight:400;font-size:14px;color:var(--ink2)}

/* 증거물 + 돋보기 */
.ev{position:relative;background:#e7d6ae;border:1px solid rgba(110,80,40,.35);border-radius:4px;padding:44px 18px 18px;box-shadow:inset 0 2px 10px rgba(80,55,25,.18)}
.ev.lens-on{cursor:crosshair;touch-action:none}
.ev-in{position:relative}
.lens-btn{position:absolute;right:8px;top:8px;z-index:4;background:rgba(35,26,18,.88);color:var(--brass2);border:1px solid var(--brass);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.lens-btn.on{background:var(--brass2);color:var(--ink)}
.lens{position:absolute;width:190px;height:190px;border-radius:50%;overflow:hidden;pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:5;background:#e7d6ae;border:7px solid #8a6427;box-shadow:0 0 0 2px #e6c57c,0 12px 30px rgba(0,0,0,.45),inset 0 0 30px rgba(255,255,255,.35)}
.lens-in{position:absolute;left:0;top:0;transform-origin:0 0}
.lens::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.4),transparent 35%)}
.tape{position:absolute;width:90px;height:24px;background:rgba(240,230,190,.7);box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:2}
.tape.l{left:-14px;top:-8px;transform:rotate(-22deg)}.tape.r{right:40px;bottom:-10px;transform:rotate(14deg)}

/* 답 입력 */
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:12px;padding-top:16px;border-top:1.5px dashed rgba(120,90,50,.45)}
.answer .lbl{font-family:var(--type);background:var(--ink);color:var(--brass2);padding:9px 14px;border-radius:3px;letter-spacing:.1em;font-size:14px}
.answer .fmt{width:100%;text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:-2px;order:9}
.answer input{font-size:24px;font-weight:900;letter-spacing:.18em;padding:10px 16px;border:2px solid var(--ink);border-radius:6px;background:#fbf5e4;color:var(--red);width:min(300px,100%);text-align:center;outline:none}
.answer input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(230,197,124,.55)}
.answer input::placeholder{color:#c9b38a;letter-spacing:.3em;font-weight:400}
.btn{background:linear-gradient(#3a2c1f,#231a12);color:var(--brass2);border:1.5px solid var(--brass);border-radius:6px;padding:12px 22px;font-size:16px;font-weight:900;letter-spacing:.1em;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(#f0d48a,#c99a45);color:var(--ink);border-color:#8a6427}
.btn.red{background:linear-gradient(#a8352a,#7a1d16);color:#fbe9d2;border-color:#5a120d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.foot{text-align:center;font-family:var(--type);font-size:11px;letter-spacing:.3em;color:#9a845c;margin-top:16px}

/* ---------- 증거물별 ---------- */
/* 1 검은 카드 */
.mcard{max-width:520px;margin:0 auto;background:radial-gradient(ellipse at 30% 20%,#2c2c2c,#0d0d0d);border-radius:10px;padding:22px 26px 18px;color:#d8c08a;box-shadow:0 14px 30px rgba(0,0,0,.45);position:relative;outline:1.5px solid #b98a3e;outline-offset:-9px}
.mcard .mono{font-family:var(--display);font-style:italic;font-weight:900;font-size:40px;color:#e6c57c;position:absolute;right:24px;top:8px;line-height:1}
.mcard .flag{position:relative;aspect-ratio:3/2;width:78%;margin:22px auto 10px;background:#fbf7ee;border:2px solid #fff;box-shadow:0 0 0 1px #777}
.mcard .flag span{position:absolute;font-family:var(--pen);font-size:clamp(36px,7vw,52px);color:#1d1d1d;line-height:1;transform:translate(-50%,-50%)}
.mcard p{text-align:center;font-family:var(--serif);font-size:15px;margin:6px 0 0;color:#cdb37c}
/* 2 회중시계 */
.watch{display:block;width:min(260px,70%);margin:0 auto}
.angles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.angles span{font-family:var(--type);font-size:28px;background:#2b2118;color:var(--brass2);border:1.5px solid var(--brass);border-radius:6px;padding:6px 16px;min-width:86px;text-align:center}
/* 3 화살표 자모 */
.jrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.tiles{display:flex;border:1px solid #c9b48a;background:#fbf6e8}
.tile{width:62px;height:70px;border-right:1px solid #e0d2b0}
.tile:last-child{border-right:0}
.tile svg{width:100%;height:100%}
.eq{font-family:var(--sans);font-size:30px;font-weight:900;color:#4a3d2c}
.qbox{width:96px;height:70px;border-radius:8px;background:#efe6d0;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:40px;font-weight:700;color:#4a3d2c}
.qbox svg{width:76px}
/* 4 택시 */
.chat{position:relative;max-width:440px;margin:0 auto;padding:6px 0}
.bub{position:relative;width:62%;margin:0 auto;background:#fffaf0;border:1.5px solid #cdbb95;border-radius:50%;aspect-ratio:2.25/1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--sans);font-size:clamp(12px,2.5vw,15px);line-height:1.45;color:#3a3226;margin-top:-4.2%;padding:0 6%}
.bub:first-child{margin-top:0}
.bub .num{position:absolute;left:50%;bottom:-12%;transform:translate(-50%,0);font-family:var(--sans);font-weight:900;font-size:15px;color:#fbf6e8;background:#3a3226;border-radius:999px;width:30px;height:24px;display:flex;align-items:center;justify-content:center;z-index:5}
.cab{position:absolute;width:15%;top:50%;transform:translateY(-50%)}
.cab.l{left:-17%}.cab.r{right:-17%}
.chat-q{text-align:center;font-family:var(--sans);font-weight:900;font-size:22px;margin-top:12px;color:#3a3226}
/* 5 명부 */
.ledger{max-width:420px;margin:0 auto;background:#fbf5e3;border:1px solid #c6b088;box-shadow:0 6px 14px rgba(0,0,0,.15);padding:14px 18px 10px;position:relative}
.ledger h4{margin:0 0 8px;text-align:center;font-family:var(--display);font-style:italic;font-size:22px;color:#5a3a1c}
.ledger table{width:100%;border-collapse:collapse}
.ledger th{height:38px;position:relative}
.ledger th .torn{position:absolute;inset:3px 6px;background:#e9dcbd;clip-path:polygon(0 30%,8% 0,18% 22%,30% 4%,42% 26%,55% 0,66% 20%,78% 2%,90% 24%,100% 6%,100% 100%,0 100%);display:flex;align-items:center;justify-content:center;font-family:var(--pen);font-size:26px;color:#a99263}
.ledger td{border-top:1px solid #d9c9a3;padding:5px 6px;text-align:center;font-family:var(--pen);font-size:28px;color:#24323f;line-height:1.15}
.ledger td.blot span{display:inline-block;width:62px;height:16px;border-radius:40%;background:radial-gradient(ellipse,#23303b 30%,rgba(35,48,59,.4) 70%,transparent 72%);vertical-align:middle;opacity:.85}
.ledger .more{text-align:center;font-family:var(--pen);font-size:28px;color:#24323f}
/* 6,7 수첩 */
.diary{max-width:600px;margin:0 auto;background:repeating-linear-gradient(#fbf6e6 0 37px,#b9cfe0 37px 38px);border-left:3px double #d48a7e;padding:14px 22px 14px 34px;font-family:var(--pen);font-size:clamp(25px,4.6vw,32px);line-height:38px;color:#26313d;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.diary b{font-weight:400;color:#0e1218;-webkit-text-stroke:.9px #0e1218;text-shadow:.6px 0 #0e1218,-.4px 0 #0e1218}
.diary .nums{display:block;text-align:center;font-size:44px;letter-spacing:.35em;color:#8f241b;margin-bottom:6px}
.diary .ask{display:block;text-align:center;color:#8f241b;margin-top:8px}
/* 8 전광판 */
.board{max-width:600px;margin:0 auto;background:#151515;border:6px solid #2b2b2b;border-radius:8px;padding:12px 16px 16px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.board .hd{display:flex;justify-content:space-between;font-family:var(--type);color:#f1b544;font-size:15px;letter-spacing:.15em;border-bottom:1px solid #333;padding-bottom:6px}
.board .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding-top:12px}
.board .dest{font-family:var(--type);font-size:clamp(22px,4.6vw,32px);color:#f1b544;letter-spacing:.12em}
.board .dest small{display:block;font-size:13px;color:#a58435;letter-spacing:.2em}
.seg{display:flex;gap:8px;background:#0b0b0b;padding:10px 12px;border-radius:4px;border:1px solid #2f2f2f}
.seg svg{width:clamp(38px,8vw,56px);height:auto}
.motto{text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(17px,3vw,21px);color:#4a3a28;margin-top:14px;letter-spacing:.02em}
/* 9 X선 */
.xray{max-width:600px;margin:0 auto;background:radial-gradient(ellipse at 50% 40%,#123a5c,#06182a);border:8px solid #2b3238;border-radius:10px;padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;overflow:hidden}
.xray::after{content:'';position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(120,220,255,.12),transparent);animation:scan 3.6s linear infinite;pointer-events:none}
@keyframes scan{from{top:-30%}to{top:100%}}
.xitem{text-align:center}
.xitem svg{width:100%;height:auto}
.xitem b{display:block;font-family:var(--sans);font-weight:900;color:#d7f2ff;font-size:clamp(26px,5vw,40px);text-shadow:0 0 12px rgba(120,220,255,.8);margin-top:4px}
.xlabel{grid-column:1/-1;font-family:var(--type);color:#7fc4e8;font-size:12px;letter-spacing:.2em;display:flex;justify-content:space-between}
/* 10,11 노트북 */
.laptop{max-width:600px;margin:0 auto}
.screen{background:linear-gradient(160deg,#1d2a35,#0f161d);border:12px solid #222;border-bottom-width:16px;border-radius:12px 12px 0 0;padding:18px;position:relative;min-height:220px;color:#cfe0ea;text-align:center}
.screen .wall{font-family:var(--type);font-size:clamp(15px,3.7vw,30px);letter-spacing:.22em;white-space:nowrap;color:#e7f2f8;margin:6px 0 14px;text-shadow:0 0 14px rgba(150,200,255,.5)}
.screen .pw{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:8px 18px;font-family:var(--sans);font-size:14px}
.screen .pw i{width:12px;height:12px;border-radius:50%;border:1.5px solid #9fb6c6;display:inline-block}
.sticky{position:relative;margin:14px auto 0;max-width:430px;background:#f7e48a;color:#3b3214;padding:12px 16px;font-family:var(--pen);font-size:clamp(23px,4.2vw,28px);line-height:1.3;transform:rotate(-1.5deg);box-shadow:0 6px 10px rgba(0,0,0,.35);text-align:left}
.base{height:16px;background:linear-gradient(#c9ccd0,#8c9096);border-radius:0 0 14px 14px;margin:0 -24px;position:relative}
.base::after{content:'';position:absolute;left:42%;right:42%;top:0;height:6px;background:#777;border-radius:0 0 6px 6px}
.seq{font-family:var(--type);font-size:clamp(20px,4.4vw,36px);color:#e7f2f8;margin:26px 0 20px;display:flex;flex-wrap:wrap;justify-content:center;gap:.25em .5em}
.seq i{font-style:normal;color:#f1b544;display:inline-block;min-width:1.1em;border-bottom:3px solid #f1b544;text-align:center;line-height:1.1}
/* 12 승차권 */
.ticket{max-width:460px;margin:0 auto;background:linear-gradient(90deg,#f6eed8 0 78%,#efe2c0 78%);border:1px solid #b9a072;border-radius:10px;padding:14px 18px;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.ticket::before{content:'';position:absolute;left:78%;top:8px;bottom:8px;border-left:2px dashed #b9a072}
.ticket h4{margin:0 0 6px;font-family:var(--type);letter-spacing:.2em;font-size:13px;color:#8f241b}
.ticket .eqs{font-family:var(--type);font-size:clamp(26px,5vw,34px);line-height:1.5;color:#2b2016;width:74%;text-align:center}
.ticket .stub{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(90deg);font-family:var(--type);font-size:12px;letter-spacing:.2em;color:#8f241b;white-space:nowrap}
/* 13 자물쇠 상자 */
.lockbox{max-width:620px;margin:0 auto;background:linear-gradient(#5a3d24,#3c2816);border-radius:10px;padding:14px;border:3px solid #2a1b0e;box-shadow:inset 0 0 0 2px #8a6427,0 10px 24px rgba(0,0,0,.4)}
.grid13{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#e8dcbf;padding:10px;border-radius:4px}
.grid13 button{font-family:var(--type);font-size:clamp(17px,3.6vw,24px);background:transparent;border:0;border-radius:4px;padding:4px 0;color:#2b2016;transition:background .15s}
.grid13 button:hover{background:rgba(185,138,62,.2)}
.grid13 button.mk{background:#2b2016;color:#e8dcbf}
.grid13 button.qm{color:var(--red);font-weight:700}
.dial{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:12px;font-family:var(--serif);font-weight:800;color:#f0d48a;font-size:18px}

/* ---------- 오버레이 ---------- */

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);opacity:0;background:#231a12;color:var(--brass2);border:1.5px solid var(--brass);border-radius:999px;padding:12px 22px;font-family:var(--sans);font-weight:700;z-index:80;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}

@media (max-width:640px){

}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.tocl{display:inline-block;margin:4px 0 0;font-family:var(--sans);font-size:14px;font-weight:700;color:#c9b48a;text-decoration:none;border:1px solid rgba(185,138,62,.5);border-radius:999px;padding:6px 14px;background:rgba(20,15,11,.6)}

#hud:not([hidden])+.tocl{display:none}

/* ---------------- 오디오 (Web Audio로 직접 합성 — 저작권 걱정 없음) ---------------- */
const AU={
 ctx:null,on:true,mode:'mystery',level:0,tense:false,bar:0,cycle:0,nextT:0,nextThunder:0,

 init(){

  ded:'자판 위에서 화살표만큼 옮기면 <b>스웨터</b>! 사물함 맨 아래에 정말로 비에 젖은 <b>스웨터</b>가 구겨져 있다. 주머니 속에서 <em>택시 영수증</em>이 나왔다.',

 {place:'킹스크로스역 · 택시 승강장',title:'택시 기사들의 무전',

let lensOn=false;

 if(locked())return;const i=S.stage,c=CASES[i],raw=input.value;
 const v=norm(raw);if(!v){toast('추리를 먼저 적어 주세요');input.focus();return}
 if(check(i,raw)){pass(i,raw.trim());return}
 const hasKo=/[ㄱ-ㆎ가-힣]/.test(v),hasEn=/[a-z]/.test(v),hasNum=/[0-9]/.test(v);
 if(c.type==='ko'&&!hasKo&&hasEn){toast('<b>한/영</b> 키를 눌러 <b>한글</b>로 적어 주세요');return}
 if(c.type==='en'&&hasKo){toast('<b>한/영</b> 키를 눌러 <b>영어</b>로 적어 주세요');return}
 if(c.type==='num'&&!/^[0-9]+$/.test(v)){toast('<b>숫자</b>만 적어 주세요');return}
 if([...v].length!==c.len){toast(`<b>${c.len}${c.type==='num'?'자리':'글자'}</b>로 적어 주세요`);return}
 fail(i);input.select();
}
function fail(i){
 S.wrong[i]=(S.wrong[i]||0)+1;S.totalWrong=(S.totalWrong||0)+1;save();AU.wrong();
 const a=$('#main .answer');if(a){a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
 const w=S.wrong[i];
 if(w%3===0){lock(i===12?30:20)}
 else toast(['흠… 그건 아닌 것 같군.','다시 관찰해 보게.','단서를 하나 놓친 것 같은데?'][w%3]+` <span style="opacity:.7">(${3-w%3}번 더 틀리면 잠시 멈춤)</span>`);
}
function lock(sec){$('#toast').classList.remove('show');S.lockUntil=Date.now()+sec*1000;save();AU.lockS();flash();showLock()}
let lockIv=0;
function showLock(){
 const el=$('#lock');el.hidden=false;
 el.innerHTML=`<div class="ic">🎩</div><h2>레스트레이드 경감이 막아섰다!</h2><p>“진정하게, 탐정! 마구 찍으면 범인이 눈치챈다네.<br>잠깐 숨을 고르고, 단서를 처음부터 다시 읽어 보게.”</p><div class="cnt" id="lockT"></div>`;
 clearInterval(lockIv);const upd=()=>{const r=Math.ceil((S.lockUntil-Date.now())/1000);if(r<=0){clearInterval(lockIv);el.hidden=true;S.lockUntil=0;save();const f=$('#main .answer input');f&&f.focus()}else $('#lockT').textContent=r};upd();lockIv=setInterval(upd,250);
}

function pass(i,val){
 const c=CASES[i];S.solved[i]=val;S.stage=i+1;if(i===12)S.end=Date.now();save();AU.correct();AU.stamp();
 setTimeout(()=>AU.stamp(),10);
 openModal(`<div class="deduce"><p class="m-sub">CASE ${pad(i+1)} · ${esc(c.place)}</p><div class="stamp">해 결</div><div class="words">${c.words.map((w,k)=>`<span style="animation-delay:${.25+k*.35}s">${w}</span>`).join('')}</div><div class="code">${esc(val)}</div><p>${c.ded}</p><button class="btn gold" data-go>${i<12?'▶ 다음 단서를 쫓는다':'▶ 상자를 연다'}</button><div class="quote">${c.quote} — 셜록 홈즈</div></div>`,{sticky:true});

/* ---------------- 돋보기 ---------------- */
function setupLens(ev){
 if(!ev)return;const btn=$('.lens-btn',ev),src=$('.ev-in',ev);
 const lens=document.createElement('div');lens.className='lens';const inner=document.createElement('div');inner.className='lens-in';lens.appendChild(inner);ev.appendChild(lens);
 let on=false;const Z=2;
 btn.addEventListener('click',e=>{e.stopPropagation();on=!on;btn.classList.toggle('on',on);ev.classList.toggle('lens-on',on);AU.click();if(!on)lens.style.display='none';else toast('증거물 위를 움직여 보세요 (손가락으로 끌어도 돼요)',2200)});
 const move=e=>{if(!on)return;const r=ev.getBoundingClientRect(),sr=src.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  if(x<0||y<0||x>r.width||y>r.height){lens.style.display='none';return}
  if(!lens._fresh){inner.innerHTML=src.innerHTML;inner.style.width=sr.width+'px';lens._fresh=true}
  const R=lens.offsetWidth/2||95,sx=e.clientX-sr.left,sy=e.clientY-sr.top;
  lens.style.display='block';lens.style.left=x+'px';lens.style.top=y+'px';inner.style.transform=`translate(${R-sx*Z}px,${R-sy*Z}px) scale(${Z})`};
 ev.addEventListener('pointerenter',()=>{lens._fresh=false});
 ev.addEventListener('pointerdown',e=>{lens._fresh=false;move(e)});
 ev.addEventListener('pointermove',move);
 ev.addEventListener('pointerleave',()=>{lens.style.display='none'});
}

 a.innerHTML=`<div class="rule"></div><h3 class="m-title" style="font-size:24px">탐정 수칙</h3><ul class="rules">
  <li><b class="n">1</b><span>모든 사건은 <b>혼자</b> 푼다. 친구에게 답을 묻거나 알려 주지 않는다.</span></li>
  <li><b class="n">2</b><span>자정까지 <b>40분</b>. 화면 위 시계 막대를 확인하라.</span></li>
  <li><b class="n">3</b><span>한 사건에서 <b>세 번</b> 틀리면 레스트레이드 경감이 잠시 막아선다. 함부로 찍지 마라.</span></li>
  <li><b class="n">4</b><span>막히면 <b>왓슨의 메모</b>를 기다려라. 한 사건에 2분, 4분이 지나면 도착한다.</span></li>
  <li><b class="n">5</b><span>작은 글씨는 <b>🔍 돋보기</b>로, 지난 단서는 <b>사건 보드</b>에서 다시 볼 수 있다.</span></li>
  <li><b class="n">6</b><span>연필과 종이를 곁에 두고, 이어폰을 끼면 런던의 빗소리가 들린다. 🎧</span></li></ul>
  <div class="namebox"><input id="nm" maxlength="20" placeholder="탐정 이름 (예: 12번 김탐정)" autocomplete="off"><button class="btn gold" id="go">🔍 수사 시작</button></div>`;
 const start=()=>{const n=$('#nm').value.trim();if(!n){toast('탐정 이름을 적어 주세요');$('#nm').focus();return}AU.init();S=blank();S.name=n;S.start=Date.now();save();setSndBtn();travel(CASES[0].place)};
 $('#go').onclick=start;$('#nm').addEventListener('keyup',e=>{if(e.key==='Enter'&&!e.isComposing)start()});
 setTimeout(()=>a.scrollIntoView({behavior:'smooth',block:'center'}),100);

/* ---------------- 엔딩 ---------------- */
function openBox(){
 AU.setLevel(13,'victory');$('#btnHint').hidden=true;$('#chip').textContent='사건 종결';$('#placeSm').textContent='EUROSTAR 4723';
 $('#main').innerHTML=`<section class="file"><div class="file-tab">CASE CLOSED</div><div class="paper" style="text-align:center"><div class="place" style="justify-content:center">${IC.pin}유로스타 4723호 · 10호차 25번</div><h1 class="c-title">상자 속의 진실</h1>${boxSVG()}<div id="endtxt"></div></div></section>`;
 window.scrollTo({top:0,behavior:'smooth'});
 setTimeout(()=>{$('#box3d').classList.add('open');AU.open()},600);
 setTimeout(()=>{AU.fanfare();finalLetter()},2400);
}
function finalLetter(){
 const txt=`상자 속에는 사라졌던 홈즈의 돋보기와, 낯익은 글씨의 편지가 들어 있었다.

“훌륭하네, ${S.name} 탐정.
이 편지를 읽고 있다면 이제 진실을 말할 때가 되었군.

M은 바로 ‘Me’, 나 셜록 홈즈였다네.
태극기 카드, 젖은 스웨터, 나이키 발자국, 원숭이 열쇠고리, 가방 속 라면까지…
모두 자네의 눈을 시험하려고 내가 흘린 단서였지.

자네는 끝까지 보고, 관찰하고, 추리했네.
이 돋보기는 이제 자네 것이네. 베이커가의 새로운 탐정이여.”`;
 const out=$('#endtxt');out.innerHTML=`<div class="typed" id="et" style="text-align:left;max-width:600px;margin:14px auto 0"></div><button class="skip" id="eskip">건너뛰기 ▸</button>`;
 const chars=[...txt];let k=0;const et=$('#et');
 const fin=()=>{clearInterval(typeIv);et.innerHTML=esc(txt)+'<span class="sig">— S. H.</span>';$('#eskip')&&$('#eskip').remove();certificate()};
 typeIv=setInterval(()=>{k++;et.innerHTML=esc(chars.slice(0,k).join(''))+'<span class="caret"></span>';if(chars[k-1]&&chars[k-1].trim()&&k%2)AU.key();if(k>=chars.length)fin()},38);
 $('#eskip').onclick=fin;
}
function certificate(){
 const sec=((S.end||Date.now())-S.start)/1000,hints=Object.values(S.hints).reduce((a,b)=>a+b,0),wr=S.totalWrong||0;
 const rank=hints<=2&&wr<=3?'셜록 홈즈급 명탐정':hints<=8?'왓슨 박사급 탐정':'베이커가 특공대 탐정';
 const div=document.createElement('div');
 div.innerHTML=`<div class="cert"><h2>Certificate of Detective</h2><div class="kr">명탐정 인증서</div><div class="who">${esc(S.name)}</div><div class="rank">${rank}</div><p style="margin:6px 0;line-height:1.7">위 탐정은 런던 곳곳에 숨겨진 M의 수수께끼 13개를 모두 풀고<br>사라진 홈즈의 돋보기를 되찾았기에 이 인증서를 드립니다.</p>
  <div class="stats"><div><small>수사 시간</small><b>${fmt(sec)}</b></div><div><small>왓슨의 메모</small><b>${hints}장</b></div><div><small>잘못된 추리</small><b>${wr}번</b></div></div>
  <p style="font-family:var(--display);font-style:italic;margin:0">Baker Street 221B, London</p><div class="wax">SH</div></div>
  <p class="tip" style="font-size:15px;margin-top:14px">🏅 이 화면을 선생님께 보여 주세요.</p><button class="mini" id="eb">사건 보드 보기</button>`;
 $('#endtxt').appendChild(div);$('#eb').onclick=openBoard;updateHUD();
}
function ending(again){
 $('#hud').hidden=false;AU.setLevel(13,'victory');$('#btnHint').hidden=true;$('#chip').textContent='사건 종결';
 $('#main').innerHTML=`<section class="file"><div class="file-tab">CASE CLOSED</div><div class="paper" style="text-align:center"><h1 class="c-title">사건 종결</h1>${boxSVG()}<div id="endtxt"></div></div></section>`;
 $('#box3d').classList.add('open');certificate();updateHUD();
}

/* ---------------- 교사 메뉴 ---------------- */
let taps=[];
function teacherTap(){const n=Date.now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>=5){taps=[];teacherLogin()}}
function teacherLogin(){
 openModal(`<h2 class="m-title">교사 메뉴</h2><div class="namebox"><input id="tc" type="password" inputmode="numeric" placeholder="교사 코드" autocomplete="off"><button class="btn gold" id="tcGo">열기</button></div>`);
 const go=()=>{if(hx('teacher:'+$('#tc').value)===TCODE)teacherPanel();else toast('코드가 맞지 않습니다')};$('#tcGo').onclick=go;$('#tc').addEventListener('keyup',e=>{if(e.key==='Enter')go()});$('#tc').focus();
}
function teacherPanel(){
 openModal(`<h2 class="m-title">교사 메뉴</h2><p class="m-sub">진행 관리</p><p style="text-align:center">현재: ${S?esc(S.name)+' · 사건 '+pad(Math.min(S.stage+1,13)):'시작 전'}</p>
 <p class="tip">사건으로 바로 이동 (앞 사건은 '교사 이동'으로 기록됩니다)</p><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 16px">${CASES.map((c,i)=>`<button class="mini" style="margin:0" data-j="${i}">${i+1}</button>`).join('')}</div>
 <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="tUnlock">잠금 풀기</button><button class="btn" id="tHint">메모 즉시 도착</button><button class="btn red" id="tReset">처음부터 (새 학생)</button></div>`);
 $$('#ov [data-j]').forEach(b=>b.onclick=()=>{if(!S){S=blank();S.name='선생님';S.start=Date.now()}const j=+b.dataset.j;for(let k=0;k<j;k++)if(S.solved[k]===undefined)S.solved[k]='교사 이동';for(let k=j;k<13;k++)delete S.solved[k];S.stage=j;S.end=0;S.stageStart[j]=Date.now();S.lockUntil=0;save();AU.init();setSndBtn();closeModal();renderCase()});
 $('#tUnlock').onclick=()=>{if(S){S.lockUntil=Date.now();save()}closeModal();toast('잠금을 풀었습니다')};
 $('#tHint').onclick=()=>{if(S&&S.stage<13){S.stageStart[S.stage]=Date.now()-HINT2*1000;save();updateHUD()}closeModal();toast('이 사건의 메모가 모두 도착했습니다')};
 $('#tReset').onclick=()=>{if(!confirm('이 기기의 진행 기록을 모두 지우고 처음 화면으로 갑니다.'))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
}

/* ---------------- 비 내리는 배경 ---------------- */
function rain(){
 const cv=$('#rain'),g=cv.getContext('2d');let W,H,drops=[];
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;drops=Array.from({length:Math.min(120,Math.floor(W/9))},()=>({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*16,v:7+Math.random()*7}))};
 rs();addEventListener('resize',rs);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const step=()=>{g.clearRect(0,0,W,H);g.strokeStyle='rgba(170,190,205,.35)';g.lineWidth=1;g.beginPath();for(const d of drops){g.moveTo(d.x,d.y);g.lineTo(d.x-d.l*.18,d.y+d.l);d.y+=d.v;d.x-=d.v*.18;if(d.y>H){d.y=-20;d.x=Math.random()*W*1.1}}g.stroke();requestAnimationFrame(step)};step();
}

/* ---------------- 시작 ---------------- */
(function boot(){
 rain();
 $('#logo').innerHTML=IC.logo;$('#bigben').innerHTML=IC.bigben;$('#brand').addEventListener('click',teacherTap);
 $('#btnBoard').innerHTML=IC.board+'사건 보드';$('#btnBoard').onclick=()=>{AU.click();openBoard()};
 $('#btnHint').onclick=()=>{AU.click();openHints()};
 AU.on=sndPref();setSndBtn();$('#btnSnd').onclick=()=>{AU.init();AU.setSound(!AU.on);setSndBtn()};
 setInterval(updateHUD,1000);
 intro();
})();
</script>
