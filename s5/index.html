<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셜록 홈즈 5 · 바스커빌가의 사냥개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Pen+Script&family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0c0f12;--ink:#231a12;--ink2:#5c4c3a;--paper:#f1e5c9;--paper2:#e3d1a8;--paper3:#d6bf8f;
  --brass:#b98a3e;--brass2:#e6c57c;--red:#a32a20;--red2:#c8443a;--green:#1f3b33;--gas:#f3c46a;
  --serif:'Nanum Myeongjo',serif;--sans:'Noto Sans KR',system-ui,sans-serif;--pen:'Nanum Pen Script',cursive;
  --type:'Special Elite','Nanum Myeongjo',monospace;--display:'Playfair Display','Nanum Myeongjo',serif;
}
*{box-sizing:border-box}
html{background:#07090b}
html,body{margin:0;min-height:100%}
body{min-height:100vh}
body{background:radial-gradient(ellipse at 50% -20%,#2b3236 0%,#141a1e 45%,#07090b 100%) fixed;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:var(--sans);cursor:pointer}
input{font-family:var(--sans)}

/* ---------- 분위기 레이어 ---------- */
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
.fog{position:fixed;left:-50%;width:200%;height:60vh;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 30% 60%,rgba(170,180,175,.13),transparent 60%),radial-gradient(ellipse at 75% 40%,rgba(170,180,175,.1),transparent 55%);animation:drift 60s linear infinite}
.fog.f1{bottom:-10vh}.fog.f2{bottom:20vh;animation-duration:90s;animation-direction:reverse;opacity:.7}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
#flash{position:fixed;inset:0;background:#dfe9f5;opacity:0;pointer-events:none;z-index:90}
#flash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}6%{opacity:.5}12%{opacity:.05}20%{opacity:.35}100%{opacity:0}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.55) 100%);animation:gaslight 7s ease-in-out infinite}
@keyframes gaslight{0%,100%{opacity:1}43%{opacity:.88}45%{opacity:1}47%{opacity:.9}}

#app{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:14px 14px 50px}

/* ---------- HUD ---------- */
.topbar{display:flex;align-items:center;gap:12px;background:linear-gradient(#2a2119,#1a140f);border:1.5px solid var(--brass);border-radius:6px;padding:9px 14px;color:var(--brass2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;user-select:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--brass2)}
.brand small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.18em;color:#a8936a}
.casechip{margin-left:auto;text-align:right}
.casechip small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.2em;color:#a8936a}
.casechip b{font-family:var(--sans);font-weight:900;font-size:19px;color:var(--brass2);letter-spacing:.06em}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.clockbar{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:rgba(20,15,11,.8);border:1px solid rgba(185,138,62,.55);border-radius:999px;padding:6px 14px;color:#eadbb8;font-family:var(--sans)}
.clockbar svg{width:22px;height:22px;flex:none}
.clockbar .lbl{font-size:12px;letter-spacing:.12em;color:#b9a47a;white-space:nowrap}
.clockbar .bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.clockbar .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8d6a2c,#e6c57c);transition:width 1s linear}
.clockbar.low .bar i{background:linear-gradient(90deg,#7a1d16,#d0533f)}
.clockbar.low b{color:#ff9d8a;animation:pulse 1s ease-in-out infinite}
.clockbar b{font-size:17px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.45}}
.tb{display:inline-flex;align-items:center;gap:6px;background:rgba(20,15,11,.85);border:1px solid rgba(185,138,62,.6);color:var(--brass2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;transition:background .2s,transform .1s}
.tb:hover{background:rgba(60,45,30,.95)}.tb:active{transform:scale(.97)}
.tb svg{width:16px;height:16px}
.tb[hidden]{display:none}
.tb .t{font-weight:400;color:#c7b48a;font-size:12px;font-variant-numeric:tabular-nums}
.tb.ready{background:linear-gradient(#f0d48a,#c99a45);color:var(--ink);border-color:#f0d48a;animation:glow 1.6s ease-in-out infinite}
.tb.ready .t{color:var(--ink)}
@keyframes glow{50%{box-shadow:0 0 16px 2px rgba(240,212,138,.7)}}

/* ---------- 사건 파일 ---------- */
.file{position:relative;margin-top:22px}
.file-tab{position:absolute;top:-17px;left:22px;background:#c9ab6e;color:var(--ink);font-family:var(--type);font-size:13px;letter-spacing:.14em;padding:5px 18px 8px;border-radius:8px 8px 0 0;box-shadow:0 -2px 6px rgba(0,0,0,.25)}
.paper{position:relative;background:
  radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 50%),
  radial-gradient(ellipse at 85% 90%,rgba(140,100,50,.18),transparent 55%),
  linear-gradient(#f3e8cd,#e9d9b3);border-radius:3px;padding:28px 30px 22px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 60px rgba(120,85,40,.18)}
.paper::before{content:'';position:absolute;inset:8px;border:1px solid rgba(120,90,50,.3);pointer-events:none}
.clip{position:absolute;top:-14px;right:46px;width:22px;height:62px;border:3.5px solid #8f949a;border-radius:11px;border-bottom-color:transparent;z-index:3}
.clip::after{content:'';position:absolute;left:3px;top:6px;width:9px;height:42px;border:3px solid #a9aeb4;border-radius:7px;border-top-color:transparent}
.place{font-family:var(--type);font-size:14px;letter-spacing:.08em;color:var(--red);display:flex;align-items:center;gap:6px}
.place svg{width:16px;height:16px}
.c-title{font-family:var(--serif);font-weight:800;font-size:clamp(26px,5vw,40px);margin:6px 0 8px;color:var(--ink);letter-spacing:-.01em;line-height:1.25}
.brief{font-size:17px;line-height:1.85;margin:0 0 16px;color:#3a2d20}
.brief em{font-style:normal;color:var(--red);font-weight:700}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(120,90,50,.5),transparent);margin:14px 0}
.q{font-family:var(--serif);font-weight:800;font-size:clamp(18px,3.2vw,22px);text-align:center;margin:18px 0 6px;color:var(--ink);line-height:1.6}
.q small{display:block;font-family:var(--sans);font-weight:400;font-size:14px;color:var(--ink2)}

/* 증거물 + 돋보기 */
.ev{position:relative;background:#e7d6ae;border:1px solid rgba(110,80,40,.35);border-radius:4px;padding:44px 18px 18px;box-shadow:inset 0 2px 10px rgba(80,55,25,.18)}
.ev.lens-on{cursor:crosshair;touch-action:none}
.ev-in{position:relative}
.lens-btn{position:absolute;right:8px;top:8px;z-index:4;background:rgba(35,26,18,.88);color:var(--brass2);border:1px solid var(--brass);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.lens-btn.on{background:var(--brass2);color:var(--ink)}
.lens{position:absolute;width:190px;height:190px;border-radius:50%;overflow:hidden;pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:5;background:#e7d6ae;border:7px solid #8a6427;box-shadow:0 0 0 2px #e6c57c,0 12px 30px rgba(0,0,0,.45),inset 0 0 30px rgba(255,255,255,.35)}
.lens-in{position:absolute;left:0;top:0;transform-origin:0 0}
.lens::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.4),transparent 35%)}
.tape{position:absolute;width:90px;height:24px;background:rgba(240,230,190,.7);box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:2}
.tape.l{left:-14px;top:-8px;transform:rotate(-22deg)}.tape.r{right:40px;bottom:-10px;transform:rotate(14deg)}

/* 답 입력 */
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:12px;padding-top:16px;border-top:1.5px dashed rgba(120,90,50,.45)}
.answer .lbl{font-family:var(--type);background:var(--ink);color:var(--brass2);padding:9px 14px;border-radius:3px;letter-spacing:.1em;font-size:14px}
.answer .fmt{width:100%;text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:-2px;order:9}
.answer input{font-size:24px;font-weight:900;letter-spacing:.18em;padding:10px 16px;border:2px solid var(--ink);border-radius:6px;background:#fbf5e4;color:var(--red);width:min(300px,100%);text-align:center;outline:none}
.answer input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(230,197,124,.55)}
.answer input::placeholder{color:#c9b38a;letter-spacing:.3em;font-weight:400}
.btn{background:linear-gradient(#3a2c1f,#231a12);color:var(--brass2);border:1.5px solid var(--brass);border-radius:6px;padding:12px 22px;font-size:16px;font-weight:900;letter-spacing:.1em;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(#f0d48a,#c99a45);color:var(--ink);border-color:#8a6427}
.btn.red{background:linear-gradient(#a8352a,#7a1d16);color:#fbe9d2;border-color:#5a120d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.foot{text-align:center;font-family:var(--type);font-size:11px;letter-spacing:.3em;color:#9a845c;margin-top:16px}

/* ---------- 증거물별 ---------- */
/* 1 검은 카드 */
.mcard{max-width:520px;margin:0 auto;background:radial-gradient(ellipse at 30% 20%,#2c2c2c,#0d0d0d);border-radius:10px;padding:22px 26px 18px;color:#d8c08a;box-shadow:0 14px 30px rgba(0,0,0,.45);position:relative;outline:1.5px solid #b98a3e;outline-offset:-9px}
.mcard .mono{font-family:var(--display);font-style:italic;font-weight:900;font-size:40px;color:#e6c57c;position:absolute;right:24px;top:8px;line-height:1}
.mcard .flag{position:relative;aspect-ratio:3/2;width:78%;margin:22px auto 10px;background:#fbf7ee;border:2px solid #fff;box-shadow:0 0 0 1px #777}
.mcard .flag span{position:absolute;font-family:var(--pen);font-size:clamp(36px,7vw,52px);color:#1d1d1d;line-height:1;transform:translate(-50%,-50%)}
.mcard p{text-align:center;font-family:var(--serif);font-size:15px;margin:6px 0 0;color:#cdb37c}
/* 2 회중시계 */
.watch{display:block;width:min(260px,70%);margin:0 auto}
.angles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.angles span{font-family:var(--type);font-size:28px;background:#2b2118;color:var(--brass2);border:1.5px solid var(--brass);border-radius:6px;padding:6px 16px;min-width:86px;text-align:center}
/* 3 화살표 자모 */
.jrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.tiles{display:flex;border:1px solid #c9b48a;background:#fbf6e8}
.tile{width:62px;height:70px;border-right:1px solid #e0d2b0}
.tile:last-child{border-right:0}
.tile svg{width:100%;height:100%}
.eq{font-family:var(--sans);font-size:30px;font-weight:900;color:#4a3d2c}
.qbox{width:96px;height:70px;border-radius:8px;background:#efe6d0;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:40px;font-weight:700;color:#4a3d2c}
.qbox svg{width:76px}
/* 4 택시 */
.chat{position:relative;max-width:440px;margin:0 auto;padding:6px 0}
.bub{position:relative;width:62%;margin:0 auto;background:#fffaf0;border:1.5px solid #cdbb95;border-radius:50%;aspect-ratio:2.25/1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--sans);font-size:clamp(12px,2.5vw,15px);line-height:1.45;color:#3a3226;margin-top:-4.2%;padding:0 6%}
.bub:first-child{margin-top:0}
.bub .num{position:absolute;left:50%;bottom:-12%;transform:translate(-50%,0);font-family:var(--sans);font-weight:900;font-size:15px;color:#fbf6e8;background:#3a3226;border-radius:999px;width:30px;height:24px;display:flex;align-items:center;justify-content:center;z-index:5}
.cab{position:absolute;width:15%;top:50%;transform:translateY(-50%)}
.cab.l{left:-17%}.cab.r{right:-17%}
.chat-q{text-align:center;font-family:var(--sans);font-weight:900;font-size:22px;margin-top:12px;color:#3a3226}
/* 5 명부 */
.ledger{max-width:420px;margin:0 auto;background:#fbf5e3;border:1px solid #c6b088;box-shadow:0 6px 14px rgba(0,0,0,.15);padding:14px 18px 10px;position:relative}
.ledger h4{margin:0 0 8px;text-align:center;font-family:var(--display);font-style:italic;font-size:22px;color:#5a3a1c}
.ledger table{width:100%;border-collapse:collapse}
.ledger th{height:38px;position:relative}
.ledger th .torn{position:absolute;inset:3px 6px;background:#e9dcbd;clip-path:polygon(0 30%,8% 0,18% 22%,30% 4%,42% 26%,55% 0,66% 20%,78% 2%,90% 24%,100% 6%,100% 100%,0 100%);display:flex;align-items:center;justify-content:center;font-family:var(--pen);font-size:26px;color:#a99263}
.ledger td{border-top:1px solid #d9c9a3;padding:5px 6px;text-align:center;font-family:var(--pen);font-size:28px;color:#24323f;line-height:1.15}
.ledger td.blot span{display:inline-block;width:62px;height:16px;border-radius:40%;background:radial-gradient(ellipse,#23303b 30%,rgba(35,48,59,.4) 70%,transparent 72%);vertical-align:middle;opacity:.85}
.ledger .more{text-align:center;font-family:var(--pen);font-size:28px;color:#24323f}
/* 6,7 수첩 */
.diary{max-width:600px;margin:0 auto;background:repeating-linear-gradient(#fbf6e6 0 37px,#b9cfe0 37px 38px);border-left:3px double #d48a7e;padding:14px 22px 14px 34px;font-family:var(--pen);font-size:clamp(25px,4.6vw,32px);line-height:38px;color:#26313d;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.diary b{font-weight:400;color:#0e1218;-webkit-text-stroke:.9px #0e1218;text-shadow:.6px 0 #0e1218,-.4px 0 #0e1218}
.diary .nums{display:block;text-align:center;font-size:44px;letter-spacing:.35em;color:#8f241b;margin-bottom:6px}
.diary .ask{display:block;text-align:center;color:#8f241b;margin-top:8px}
/* 8 전광판 */
.board{max-width:600px;margin:0 auto;background:#151515;border:6px solid #2b2b2b;border-radius:8px;padding:12px 16px 16px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.board .hd{display:flex;justify-content:space-between;font-family:var(--type);color:#f1b544;font-size:15px;letter-spacing:.15em;border-bottom:1px solid #333;padding-bottom:6px}
.board .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding-top:12px}
.board .dest{font-family:var(--type);font-size:clamp(22px,4.6vw,32px);color:#f1b544;letter-spacing:.12em}
.board .dest small{display:block;font-size:13px;color:#a58435;letter-spacing:.2em}
.seg{display:flex;gap:8px;background:#0b0b0b;padding:10px 12px;border-radius:4px;border:1px solid #2f2f2f}
.seg svg{width:clamp(38px,8vw,56px);height:auto}
.motto{text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(17px,3vw,21px);color:#4a3a28;margin-top:14px;letter-spacing:.02em}
/* 9 X선 */
.xray{max-width:600px;margin:0 auto;background:radial-gradient(ellipse at 50% 40%,#123a5c,#06182a);border:8px solid #2b3238;border-radius:10px;padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;overflow:hidden}
.xray::after{content:'';position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(120,220,255,.12),transparent);animation:scan 3.6s linear infinite;pointer-events:none}
@keyframes scan{from{top:-30%}to{top:100%}}
.xitem{text-align:center}
.xitem svg{width:100%;height:auto}
.xitem b{display:block;font-family:var(--sans);font-weight:900;color:#d7f2ff;font-size:clamp(26px,5vw,40px);text-shadow:0 0 12px rgba(120,220,255,.8);margin-top:4px}
.xlabel{grid-column:1/-1;font-family:var(--type);color:#7fc4e8;font-size:12px;letter-spacing:.2em;display:flex;justify-content:space-between}
/* 10,11 노트북 */
.laptop{max-width:600px;margin:0 auto}
.screen{background:linear-gradient(160deg,#1d2a35,#0f161d);border:12px solid #222;border-bottom-width:16px;border-radius:12px 12px 0 0;padding:18px;position:relative;min-height:220px;color:#cfe0ea;text-align:center}
.screen .wall{font-family:var(--type);font-size:clamp(15px,3.7vw,30px);letter-spacing:.22em;white-space:nowrap;color:#e7f2f8;margin:6px 0 14px;text-shadow:0 0 14px rgba(150,200,255,.5)}
.screen .pw{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:8px 18px;font-family:var(--sans);font-size:14px}
.screen .pw i{width:12px;height:12px;border-radius:50%;border:1.5px solid #9fb6c6;display:inline-block}
.sticky{position:relative;margin:14px auto 0;max-width:430px;background:#f7e48a;color:#3b3214;padding:12px 16px;font-family:var(--pen);font-size:clamp(23px,4.2vw,28px);line-height:1.3;transform:rotate(-1.5deg);box-shadow:0 6px 10px rgba(0,0,0,.35);text-align:left}
.base{height:16px;background:linear-gradient(#c9ccd0,#8c9096);border-radius:0 0 14px 14px;margin:0 -24px;position:relative}
.base::after{content:'';position:absolute;left:42%;right:42%;top:0;height:6px;background:#777;border-radius:0 0 6px 6px}
.seq{font-family:var(--type);font-size:clamp(20px,4.4vw,36px);color:#e7f2f8;margin:26px 0 20px;display:flex;flex-wrap:wrap;justify-content:center;gap:.25em .5em}
.seq i{font-style:normal;color:#f1b544;display:inline-block;min-width:1.1em;border-bottom:3px solid #f1b544;text-align:center;line-height:1.1}
/* 12 승차권 */
.ticket{max-width:460px;margin:0 auto;background:linear-gradient(90deg,#f6eed8 0 78%,#efe2c0 78%);border:1px solid #b9a072;border-radius:10px;padding:14px 18px;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.ticket::before{content:'';position:absolute;left:78%;top:8px;bottom:8px;border-left:2px dashed #b9a072}
.ticket h4{margin:0 0 6px;font-family:var(--type);letter-spacing:.2em;font-size:13px;color:#8f241b}
.ticket .eqs{font-family:var(--type);font-size:clamp(26px,5vw,34px);line-height:1.5;color:#2b2016;width:74%;text-align:center}
.ticket .stub{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(90deg);font-family:var(--type);font-size:12px;letter-spacing:.2em;color:#8f241b;white-space:nowrap}
/* 13 자물쇠 상자 */
.lockbox{max-width:620px;margin:0 auto;background:linear-gradient(#5a3d24,#3c2816);border-radius:10px;padding:14px;border:3px solid #2a1b0e;box-shadow:inset 0 0 0 2px #8a6427,0 10px 24px rgba(0,0,0,.4)}
.grid13{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#e8dcbf;padding:10px;border-radius:4px}
.grid13 button{font-family:var(--type);font-size:clamp(17px,3.6vw,24px);background:transparent;border:0;border-radius:4px;padding:4px 0;color:#2b2016;transition:background .15s}
.grid13 button:hover{background:rgba(185,138,62,.2)}
.grid13 button.mk{background:#2b2016;color:#e8dcbf}
.grid13 button.qm{color:var(--red);font-weight:700}
.dial{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:12px;font-family:var(--serif);font-weight:800;color:#f0d48a;font-size:18px}
.dial span{width:40px;height:50px;border-radius:6px;background:linear-gradient(#2a1b0e,#5a3d24,#2a1b0e);display:inline-flex;align-items:center;justify-content:center;font-family:var(--type);color:#f0d48a;font-size:26px;border:1px solid #8a6427}
.mini{background:none;border:1px solid #a88c58;color:#6b5734;border-radius:999px;padding:4px 12px;font-size:12px;margin:8px auto 0;display:block}
.tip{font-family:var(--sans);font-size:13px;color:var(--ink2);text-align:center;margin:8px 0 0}

/* ---------- 오버레이 ---------- */
.ov{position:fixed;inset:0;background:rgba(5,6,8,.84);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.modal{width:100%;max-width:760px;max-height:94vh;overflow:auto;animation:pop .3s ease;position:relative}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.modal .paper{padding:26px 26px 20px}
.close{position:absolute;right:12px;top:12px;background:var(--ink);color:var(--brass2);border:none;border-radius:999px;width:34px;height:34px;font-size:18px;z-index:6}
.m-title{font-family:var(--serif);font-weight:800;font-size:clamp(24px,4.6vw,34px);text-align:center;margin:0 0 4px}
.m-sub{text-align:center;font-family:var(--type);letter-spacing:.2em;font-size:12px;color:#8a7350;margin:0 0 14px}

/* 왓슨 힌트 */
.wat{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.wat svg{width:100%;height:auto}
.memo{background:#fbf6e6;border:1px solid #cdb98c;border-radius:4px;padding:12px 16px;font-family:var(--serif);font-size:17px;line-height:1.75;margin-bottom:10px;box-shadow:2px 3px 0 rgba(120,90,50,.15);position:relative}
.memo .h{font-family:var(--type);color:var(--red);letter-spacing:.2em;font-size:12px;margin-bottom:4px}
.memo.locked{background:#e6dbc2;color:#87775a;text-align:center;font-family:var(--sans);font-size:15px}
.memo .btn{display:block;margin:0 auto}
.kb{display:grid;gap:4px;margin-top:8px;font-family:var(--sans)}
.kb div{display:flex;gap:4px;justify-content:center}
.kb span{width:34px;height:36px;border:1.5px solid #6b5734;border-radius:5px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#231a12}
.kb .k1{margin-left:0}.kb .k2{margin-left:16px}.kb .k3{margin-left:36px}

/* 추리 완료 */
.deduce{text-align:center;position:relative}
.deduce .stamp{display:inline-block;border:4px solid var(--red);color:var(--red);font-family:var(--sans);font-weight:900;font-size:30px;padding:4px 18px;border-radius:8px;transform:rotate(-7deg);letter-spacing:.2em;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;margin:4px 0 8px}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.6);opacity:0}}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.words span{font-family:var(--type);background:#231a12;color:#f0d48a;padding:6px 12px;border-radius:3px;font-size:15px;opacity:0;animation:wordin .45s ease forwards}
@keyframes wordin{from{opacity:0;transform:translateY(10px) scale(.9);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.deduce .code{font-family:var(--sans);font-weight:900;font-size:clamp(26px,5.5vw,38px);color:var(--red);letter-spacing:.12em;margin:4px 0}
.deduce p{font-size:17px;line-height:1.85;margin:10px 0 16px}
.quote{font-style:italic;color:#6b5734;font-size:15px;border-top:1px solid rgba(120,90,50,.35);padding-top:10px;margin-top:6px}

/* 장소 이동 */
.travel{text-align:center;color:#e9dcbc}
.travel small{display:block;font-family:var(--type);letter-spacing:.4em;color:#a8936a;font-size:12px}
.travel .where{font-family:var(--serif);font-weight:800;font-size:clamp(30px,7vw,52px);margin:12px 0;min-height:1.3em;text-shadow:0 0 30px rgba(243,196,106,.3)}
.steps{display:flex;justify-content:center;gap:16px;margin-top:10px}
.steps i{width:14px;height:22px;border-radius:50% 50% 45% 45%;background:#a8936a;opacity:0;animation:step .3s ease forwards}
@keyframes step{to{opacity:.8}}

/* 잠금 */
.lock{z-index:60;flex-direction:column;text-align:center;color:#f1e5c9}
.lock .ic{font-size:60px;line-height:1}
.lock h2{font-family:var(--serif);font-weight:800;font-size:clamp(28px,6vw,44px);margin:10px 0;color:#ffb39f}
.lock p{font-size:18px;line-height:1.8;max-width:540px;margin:0 auto}
.lock .cnt{font-family:var(--type);font-size:72px;color:var(--brass2);margin-top:12px}

/* 사건 보드 */
.cork{position:relative;background:radial-gradient(circle at 20% 30%,#a97a4a 0 2px,transparent 3px) 0 0/13px 13px,radial-gradient(circle at 70% 60%,#8d6236 0 1.5px,transparent 2.5px) 0 0/17px 17px,linear-gradient(#b8864f,#9f7040);border:10px solid #4a3220;border-radius:6px;padding:20px 14px 16px;box-shadow:inset 0 0 40px rgba(0,0,0,.4)}
.cork svg.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.pinc{z-index:2}
.pins{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 12px;position:relative}
.pinc{position:relative;background:#f5ecd6;padding:14px 8px 8px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.35);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);border:0;color:var(--ink)}
.pinc:nth-child(odd){transform:rotate(-2deg)}.pinc:nth-child(3n){transform:rotate(2.5deg)}
.pinc .pin{position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#a3241c 60%,#5a120d);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:3}
.pinc small{font-family:var(--type);font-size:11px;color:#8a7350;letter-spacing:.1em}
.pinc b{display:block;font-size:13px;margin:3px 0;line-height:1.3}
.pinc .ans{font-weight:900;color:var(--red);font-size:16px;letter-spacing:.06em;word-break:keep-all}
.pinc.no{background:#d9ccad;color:#7d6e52}
.pinc.no .ans{color:#9a8b6c;font-size:22px}
.pinc.now{outline:3px solid #f0d48a;outline-offset:2px}
.pinc.done{cursor:pointer}
.pinc.done:hover{filter:brightness(1.06)}

/* 인트로 */
.intro{text-align:center;color:#ece0c2;padding-top:3vh}
.intro h1{font-family:var(--serif);font-weight:800;font-size:clamp(34px,7.5vw,62px);margin:8px 0 0;color:#f3e6c6;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(243,196,106,.25);line-height:1.2}
.intro .en{font-family:var(--display);font-style:italic;letter-spacing:.12em;color:var(--brass2);font-size:clamp(14px,2.6vw,18px);margin-top:8px}
.door{display:block;width:min(300px,64vw);margin:18px auto 0;cursor:pointer;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.door.knock{animation:knock .5s}
@keyframes knock{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.door .lamp{animation:lamp 4s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:1}50%{opacity:.75}52%{opacity:.95}}
.hintline{font-family:var(--sans);font-size:15px;color:#c9b48a;margin-top:12px;animation:pulse 2s ease-in-out infinite}
.envelope{position:relative;width:min(420px,90%);margin:30px auto 0;aspect-ratio:1.6;background:linear-gradient(#e8d6ad,#d8c08f);border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,.6);cursor:pointer;animation:slide .9s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateY(60px) rotate(-6deg);opacity:0}}
.envelope::before{content:'';position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#dcc697,#cdb07a);clip-path:polygon(0 0,100% 0,50% 100%)}
.envelope .seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4473a,#8f1d15 70%);box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 0 0 5px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:900;color:#f6c9b8;font-size:28px}
.envelope .to{position:absolute;left:0;right:0;bottom:12%;font-family:var(--pen);font-size:28px;color:#3a2d20}
.letter{max-width:640px;margin:20px auto 0;text-align:left;animation:pop .5s ease}
.letter .paper{padding:30px 34px}
.typed{font-family:var(--serif);font-size:17.5px;line-height:1.95;white-space:pre-wrap;min-height:20px;color:#2b2016}
.typed .sig{font-family:var(--display);font-style:italic;font-size:24px;display:block;text-align:right;margin-top:6px}
.caret{display:inline-block;width:2px;height:1.1em;background:#2b2016;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rules li{display:flex;gap:10px;line-height:1.65;font-size:16px}
.rules li b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--brass2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:13px;margin-top:2px}
.namebox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.namebox input{font-size:19px;padding:12px 16px;border-radius:6px;border:2px solid var(--ink);background:#fbf5e4;width:min(320px,100%);text-align:center;font-weight:700;color:var(--ink);outline:none}
.skip{background:none;border:none;color:#8a7350;text-decoration:underline;font-size:13px;display:block;margin:10px auto 0}

/* 엔딩 */
.box3d{display:block;width:min(320px,70%);margin:0 auto}
.box3d .lid{transform-origin:40px 118px;transform-box:view-box;transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.box3d.open .lid{transform:rotate(-38deg)}
.box3d .glow{opacity:0;transition:opacity 1.2s .6s}
.box3d.open .glow{opacity:1}
.cert{border:3px double var(--brass);padding:20px;margin-top:16px;background:radial-gradient(ellipse at 50% 30%,#fbf5e2,#efe1bd);text-align:center;position:relative}
.cert h2{font-family:var(--display);font-style:italic;font-size:clamp(26px,5vw,38px);margin:0;color:#5a3a1c}
.cert .kr{font-family:var(--serif);font-weight:800;font-size:clamp(22px,4vw,28px);margin:2px 0 10px}
.cert .who{font-family:var(--pen);font-size:clamp(40px,8vw,56px);color:var(--red);line-height:1.1}
.rank{display:inline-block;background:var(--ink);color:var(--brass2);font-family:var(--sans);font-weight:900;padding:6px 16px;border-radius:999px;margin:8px 0;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:#fbf6e6;border:1px solid #cdb98c;border-radius:6px;padding:10px 4px}
.stats small{display:block;font-family:var(--sans);font-size:12px;color:#8a7350}
.stats b{font-family:var(--sans);font-weight:900;font-size:22px}
.wax{position:absolute;right:16px;bottom:14px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d4473a,#8f1d15 70%);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:900;color:#f6c9b8;font-size:22px;transform:rotate(-10deg);box-shadow:0 3px 6px rgba(0,0,0,.3)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);opacity:0;background:#231a12;color:var(--brass2);border:1.5px solid var(--brass);border-radius:999px;padding:12px 22px;font-family:var(--sans);font-weight:700;z-index:80;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media (max-width:640px){
  #app{padding:8px 8px 40px}
  .brand small,.brand b{display:none}
  .paper{padding:24px 14px 16px}
  .ev{padding:42px 8px 12px}
  .tile{width:40px;height:48px}
  .qbox{width:64px;height:48px;font-size:28px}.qbox svg{width:52px}
  .eq{font-size:22px}
  .pins{grid-template-columns:repeat(3,1fr)}
  .wat{grid-template-columns:80px 1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .xray{grid-template-columns:repeat(2,1fr)}
  .board .row{grid-template-columns:1fr}
  .lens{width:150px;height:150px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* ===== 2편 전용 ===== */
.boxrows{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px;background:repeating-linear-gradient(#fbf6e6 0 33px,#c9dbe8 33px 34px);border-left:3px double #d48a7e;max-width:560px;margin:0 auto;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.boxrows .r{display:flex;gap:4px}
.sq{width:clamp(16px,3.6vw,28px);height:clamp(16px,3.6vw,28px);border:2px solid #26313d;background:#fffdf6}
.sq.on{background:#1a2027}
.boxrows .ask{font-family:var(--pen);font-size:clamp(26px,5vw,34px);color:#8f241b;margin-top:6px}
.receipt{max-width:340px;margin:0 auto;background:#fffdf7;padding:18px 20px 22px;font-family:var(--type);color:#2b2016;box-shadow:0 8px 16px rgba(0,0,0,.2);position:relative;--z:linear-gradient(135deg,transparent 6px,#fffdf7 0) 0 0/12px 12px repeat-x,linear-gradient(225deg,transparent 6px,#fffdf7 0) 0 0/12px 12px repeat-x}
.receipt::before,.receipt::after{content:'';position:absolute;left:0;right:0;height:10px;background:linear-gradient(-45deg,transparent 7px,#fffdf7 0),linear-gradient(45deg,transparent 7px,#fffdf7 0);background-size:14px 14px;background-repeat:repeat-x}
.receipt::before{top:-10px;transform:rotate(180deg)}.receipt::after{bottom:-10px}
.receipt h4{text-align:center;margin:0 0 4px;font-size:15px;letter-spacing:.2em}
.receipt .sub{text-align:center;font-size:11px;color:#8a7350;border-bottom:1px dashed #b9a072;padding-bottom:8px;margin-bottom:8px}
.receipt .ln{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;font-size:clamp(20px,4.2vw,26px);padding:3px 4px;font-family:var(--sans);font-weight:700}
.receipt .ln span:first-child{text-align:right}
.receipt .ln .bx{display:inline-block;width:1em;height:1em;border:2px solid #2b2016;vertical-align:-2px}
.receipt .ln .ci{display:inline-block;width:1em;height:1em;border:2px solid #2b2016;border-radius:50%;vertical-align:-2px}
.receipt .tot{border-top:1px dashed #b9a072;margin-top:8px;padding-top:8px;text-align:center;font-family:var(--sans);font-weight:900;font-size:24px;color:#8f241b}
.tiles-wall{max-width:640px;margin:0 auto;background:repeating-linear-gradient(0deg,#d9dcd8 0 2px,transparent 2px 30px),repeating-linear-gradient(90deg,#d9dcd8 0 2px,transparent 2px 60px),#f4f4ef;border:8px solid #6e2a24;border-radius:6px;padding:16px;text-align:center;position:relative}
.tiles-wall .strip{font-family:var(--type);font-size:clamp(13px,2.8vw,21px);letter-spacing:.06em;background:#1c2a52;color:#fff;padding:8px 6px;border-radius:3px;word-break:break-all}
.tiles-wall .song{font-family:var(--pen);font-size:clamp(26px,5vw,34px);color:#2d4d8c;line-height:1.25;margin:10px 0}
.tiles-wall .dirs{display:inline-grid;grid-template-columns:auto auto;gap:4px 14px;font-family:var(--sans);font-weight:700;font-size:clamp(17px,3.4vw,21px);background:rgba(255,255,255,.85);border:1px solid #bbb;border-radius:4px;padding:8px 18px;text-align:left}
.tiles-wall .spray{font-family:var(--pen);font-size:clamp(40px,8vw,58px);color:#c0261b;margin-top:10px;transform:rotate(-3deg);letter-spacing:.04em;text-shadow:0 0 6px rgba(192,38,27,.35)}
.tagwall{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;background:linear-gradient(#5a3d24,#3c2816);border-radius:8px;padding:22px 14px 16px;border:3px solid #2a1b0e}
.ptag{position:relative;background:#f3e3bd;border-radius:4px 14px 14px 4px;padding:10px 8px 10px 22px;font-family:var(--type);font-size:clamp(18px,3.8vw,24px);color:#2b2016;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.ptag::before{content:'';position:absolute;left:7px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#3c2816}
.ptag:nth-child(odd){transform:rotate(-3deg)}.ptag:nth-child(even){transform:rotate(2.5deg)}
.ptag b{font-family:var(--sans);font-weight:900}
.tagq{grid-column:1/-1;text-align:center;font-family:var(--sans);font-weight:900;font-size:26px;color:#f0d48a;letter-spacing:.1em;display:flex;justify-content:center;gap:5px;align-items:center}
.tagq i{display:inline-block;width:24px;height:24px;border:2.5px solid #f0d48a}.tagq i.f{background:#f0d48a}
.ang{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,26px);background:radial-gradient(ellipse at 50% 40%,#3a3f47,#15181c);border:6px solid #6b6f75;border-radius:10px;padding:22px 10px;max-width:600px;margin:0 auto}
.ang svg.an{width:clamp(80px,19vw,140px);height:auto}
.ang .op{font-family:var(--sans);font-weight:900;font-size:clamp(34px,7vw,56px);color:#e6e6e6}
.ang .op.q{color:#e0463a}
.g4{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;border:2px solid #2b2016;background:#fbf5e3;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.g4 div{aspect-ratio:1.7;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:clamp(18px,3.8vw,26px);border:1px solid #2b2016}
.iron{max-width:540px;margin:0 auto;background:radial-gradient(ellipse at 40% 30%,#4d5257,#23272b);border:5px solid #15181b;border-radius:10px;padding:18px 20px;color:#e6e0d2;box-shadow:inset 0 0 0 2px #6b6f75,0 10px 24px rgba(0,0,0,.4);position:relative}
.iron::before,.iron::after{content:'';position:absolute;top:10px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9aa0a6,#3a3f44)}
.iron::before{left:10px}.iron::after{right:10px}
.drow{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.drow .ds{display:flex;gap:6px;min-width:170px;justify-content:flex-end}
.drow svg{width:clamp(22px,4.5vw,32px);height:auto}
.drow b{font-family:var(--type);font-size:clamp(22px,4.6vw,30px);color:#f0d48a;min-width:80px}
.drow.txt{font-family:var(--type);font-size:clamp(22px,4.6vw,30px);color:#e6e0d2}
.iron hr{border:0;border-top:1px dashed #7c8288;margin:12px 0}
/* 수첩(낙서장) */
#pad{z-index:55}
.padbox{width:100%;max-width:900px}
.padbox .paper{padding:16px}
.padtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:10px}
.padtools button.pen{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.padtools button.pen.on{border-color:#e6c57c;box-shadow:0 0 0 2px #231a12}
#padc{display:block;width:100%;aspect-ratio:3/2;background:repeating-linear-gradient(#fffdf4 0 39px,#cfe0ec 39px 40px);border:1px solid #c9b48a;border-radius:4px;touch-action:none;cursor:crosshair}
/* 전보 */
.telegram{position:relative;width:min(440px,90%);margin:26px auto 0;aspect-ratio:1.7;background:linear-gradient(#f2e2a8,#e3cc85);border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,.6);cursor:pointer;animation:slide .9s cubic-bezier(.2,.9,.3,1);text-align:center;padding-top:9%}
.telegram .tt{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:.2em;color:#7a1d16}
.telegram .ur{display:inline-block;border:3px solid #a32a20;color:#a32a20;font-family:var(--sans);font-weight:900;padding:2px 12px;transform:rotate(-6deg);margin-top:8px;letter-spacing:.2em}

/* ================= 게임 진행 (공용) ================= */
const CASES=EP.cases, N=CASES.length;
const TOTAL=EP.minutes*60, HINT1=EP.hint1, HINT2=EP.hint2, KEY=EP.key;
function blank(){return {name:'',start:0,stage:0,solved:{},wrong:{},hints:{},stageStart:{},lockUntil:0,end:0,totalWrong:0,w10:0}}
let S=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.start?v:null}catch(e){return null}}

function locked(){return S.lockUntil>Date.now()}
function check(i,raw){return EP.ans[i].includes(hx(EP.prefix+i+':'+norm(raw)))}
function submit(input){
 if(locked())return;const i=S.stage,c=CASES[i],raw=input.value,v=norm(raw);
 if(!v){toast('추리를 먼저 적어 주세요');input.focus();return}
 if(check(i,raw)){pass(i,raw.trim());return}
 const hasKo=/[ㄱ-ㆎ가-힣]/.test(v),hasEn=/[a-z]/.test(v);
 if(c.type==='ko'&&!hasKo&&hasEn){toast('<b>한/영</b> 키를 눌러 <b>한글</b>로 적어 주세요');return}
 if(c.type==='en'&&hasKo){toast('<b>한/영</b> 키를 눌러 <b>영어</b>로 적어 주세요');return}
 if(c.type==='num'&&!/^[0-9]+$/.test(v)){toast('<b>숫자</b>만 적어 주세요');return}
 if([...v].length!==c.len){toast(`<b>${c.len}${c.type==='num'?'자리':'글자'}</b>로 적어 주세요`);return}
 fail(i);input.select();
}
function fail(i){
 S.wrong[i]=(S.wrong[i]||0)+1;S.totalWrong=(S.totalWrong||0)+1;save();AU.wrong();
 const a=$('#main .answer');if(a){a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
 const w=S.wrong[i];
 if(w%3===0)lock(20);
 else toast(['흠… 그건 아닌 것 같군.','다시 관찰해 보게.','단서를 하나 놓친 것 같은데?'][w%3]+` <span style="opacity:.7">(${3-w%3}번 더 틀리면 잠시 멈춤)</span>`);
}
let lockIv=0;
function lock(sec){$('#toast').classList.remove('show');S.lockUntil=Date.now()+sec*1000;save();AU.lockS();flash();showLock()}
function showLock(){
 const el=$('#lock');el.hidden=false;
 el.innerHTML=`<div class="ic">🎩</div><h2>레스트레이드 경감이 막아섰다!</h2><p>“진정하게, 탐정! 마구 찍으면 모리아티가 눈치챈다네.<br>잠깐 숨을 고르고, 단서를 처음부터 다시 읽어 보게.”</p><div class="cnt" id="lockT"></div>`;
 clearInterval(lockIv);const upd=()=>{const r=Math.ceil((S.lockUntil-Date.now())/1000);if(r<=0){clearInterval(lockIv);el.hidden=true;S.lockUntil=0;save();const f=$('#main .answer input');f&&f.focus()}else $('#lockT').textContent=r};upd();lockIv=setInterval(upd,250);
}
function pass(i,val){
 const c=CASES[i];S.solved[i]=val;S.stage=i+1;if(i===N-1)S.end=Date.now();save();AU.correct();AU.stamp();
 openModal(`<div class="deduce"><p class="m-sub">${EP.unitEn} ${pad(i+1)} · ${esc(c.place)}</p><div class="stamp">해 결</div><div class="words">${c.words.map((w,k)=>`<span style="animation-delay:${.25+k*.35}s">${w}</span>`).join('')}</div><div class="code">${esc(val)}</div><p>${c.ded}</p><button class="btn gold" data-go>${i<N-1?'▶ 다음 단서를 쫓는다':EP.lastBtn}</button><div class="quote">${c.quote} — 셜록 홈즈</div></div>`,{sticky:true});
 $('#ov [data-go]').onclick=()=>{closeModal();if(i===N-1)openFinale();else travel(CASES[i+1].place)};
}
function travel(place){
 const ov=$('#ov');ov.hidden=false;ov.dataset.sticky='1';AU.steps(4);
 ov.innerHTML=`<div class="travel"><small>NEXT LOCATION · 이동 중</small><div class="where" id="where"></div><div class="steps">${[0,1,2,3].map(k=>`<i style="animation-delay:${k*.42}s;transform:translateY(${k%2?8:0}px)"></i>`).join('')}</div></div>`;
 let k=0;const chars=[...place];const iv=setInterval(()=>{$('#where').textContent=chars.slice(0,++k).join('');if(k%2)AU.key();if(k>=chars.length){clearInterval(iv);setTimeout(()=>{closeModal();renderCase()},700)}},55);
}

/* ---------------- 모달 ---------------- */
function openModal(html,o={}){const ov=$('#ov');ov.hidden=false;if(o.sticky)ov.dataset.sticky='1';else delete ov.dataset.sticky;
 ov.innerHTML=`<div class="modal"${o.wide?' style="max-width:900px"':''}><div class="paper">${o.sticky?'':'<button class="close" aria-label="닫기">✕</button>'}${html}</div></div>`;
 const c=$('.close',ov);c&&(c.onclick=closeModal);ov.onclick=e=>{if(e.target===ov&&!ov.dataset.sticky)closeModal()}}
function closeModal(){const ov=$('#ov');ov.hidden=true;ov.innerHTML='';delete ov.dataset.sticky}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#pad').hidden){$('#pad').hidden=true;return}if(!$('#ov').hidden&&!$('#ov').dataset.sticky)closeModal()});

 return `<section class="file"><div class="file-tab">${EP.unitEn} ${pad(i+1)} · ${EP.tabName}</div><div class="paper"><div class="clip"></div>
  <div class="place">${IC.pin}${esc(c.place)}</div><h1 class="c-title">${c.title}</h1><p class="brief">${c.brief}</p>
  <div class="ev"><span class="tape l"></span><button class="lens-btn">🔍 돋보기</button><div class="ev-in">${c.ev()}</div></div>
  <div class="q">${c.q}</div>
  ${ro?`<div class="answer"><span class="lbl">해결</span><b style="font-family:var(--sans);font-size:24px;color:var(--red);letter-spacing:.1em">${esc(S.solved[i]||'')}</b></div>`
   :`<div class="answer"><span class="lbl">추리 입력</span><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${c.type==='num'?'inputmode="numeric"':''} maxlength="${c.len+6}" placeholder="${'□'.repeat(c.len)}"><button class="btn gold" id="go">추리 확정</button><div class="fmt">${c.fmt||((c.type==='ko'?'한글':c.type==='en'?'영어':'숫자')+' '+c.len+(c.type==='num'?'자리':'글자'))} · ✏️ 수첩에 써 보면 풀리는 문제도 있다</div></div>`}
  <div class="foot">◆ SCOTLAND YARD · CONFIDENTIAL ◆</div></div></section>`}
function wireCase(root,ro,i){
 setupLens($('.ev',root));
 const c=CASES[i];if(c.mount)c.mount(root,ro);
 if(ro)return;
 const inp=$('#ans',root);
 inp.addEventListener('input',()=>AU.key());
 inp.addEventListener('keyup',e=>{if(e.key==='Enter'&&!e.isComposing)submit(inp)});
 $('#go',root).addEventListener('click',()=>submit(inp));
}
function renderCase(){
 const i=S.stage;if(i>=N){ending();return}
 if(!S.stageStart[i]){S.stageStart[i]=Date.now();save()}
 AU.setLevel(i,'mystery');
 $('#hud').hidden=false;$('#btnHint').hidden=false;$('#chip').textContent=`${EP.unit} ${pad(i+1)} / ${pad(N)}`;$('#placeSm').textContent=CASES[i].place.split('·')[0].trim();
 $('#main').innerHTML=caseMarkup(i,false);wireCase($('#main'),false,i);AU.paper();
 window.scrollTo({top:0,behavior:'smooth'});
 if(locked())showLock();updateHUD();
}

/* ---------------- 돋보기 ---------------- */
function setupLens(ev){
 if(!ev)return;const btn=$('.lens-btn',ev),src=$('.ev-in',ev);
 const lens=document.createElement('div');lens.className='lens';const inner=document.createElement('div');inner.className='lens-in';lens.appendChild(inner);ev.appendChild(lens);
 let on=false;const Z=2;
 btn.addEventListener('click',e=>{e.stopPropagation();on=!on;btn.classList.toggle('on',on);ev.classList.toggle('lens-on',on);AU.click();if(!on)lens.style.display='none';else toast('증거물 위를 움직여 보세요 (손가락으로 끌어도 돼요)',2200)});
 const move=e=>{if(!on)return;const r=ev.getBoundingClientRect(),sr=src.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  if(x<0||y<0||x>r.width||y>r.height){lens.style.display='none';return}
  if(!lens._fresh){inner.innerHTML=src.innerHTML;inner.style.width=sr.width+'px';lens._fresh=true}
  const R=lens.offsetWidth/2||95,sx=e.clientX-sr.left,sy=e.clientY-sr.top;
  lens.style.display='block';lens.style.left=x+'px';lens.style.top=y+'px';inner.style.transform=`translate(${R-sx*Z}px,${R-sy*Z}px) scale(${Z})`};
 ev.addEventListener('pointerenter',()=>{lens._fresh=false});
 ev.addEventListener('pointerdown',e=>{lens._fresh=false;move(e)});
 ev.addEventListener('pointermove',move);
 ev.addEventListener('pointerleave',()=>{lens.style.display='none'});
}

/* ---------------- 탐정 수첩 ---------------- */
const PAD={strokes:[],cur:null,color:'#1d1d1d'};
function setupPad(){
 const cv=$('#padc'),g=cv.getContext('2d');
 const redraw=()=>{g.clearRect(0,0,cv.width,cv.height);g.lineCap='round';g.lineJoin='round';for(const s of PAD.strokes){g.strokeStyle=s.c;g.lineWidth=6;g.beginPath();s.p.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));if(s.p.length===1)g.lineTo(s.p[0][0]+.1,s.p[0][1]);g.stroke()}};
 const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);PAD.cur={c:PAD.color,p:[pt(e)]};PAD.strokes.push(PAD.cur);redraw()});
 cv.addEventListener('pointermove',e=>{if(!PAD.cur)return;PAD.cur.p.push(pt(e));redraw()});
 const end=()=>{PAD.cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 $$('#pad .pen').forEach(b=>b.onclick=()=>{PAD.color=b.dataset.c;$$('#pad .pen').forEach(x=>x.classList.toggle('on',x===b));AU.click()});
 $('#padUndo').onclick=()=>{PAD.strokes.pop();redraw()};
 $('#padClear').onclick=()=>{PAD.strokes=[];redraw()};
 $('#padX').onclick=()=>{$('#pad').hidden=true};
 $('#pad').addEventListener('click',e=>{if(e.target.id==='pad')$('#pad').hidden=true});
}

/* ---------------- 힌트 ---------------- */
function hintState(i){const t=(Date.now()-(S.stageStart[i]||Date.now()))/1000;return [t>=HINT1,t>=HINT2,t]}
function openHints(){
 if(S.stage>=N)return;const i=S.stage,[r1,r2,t]=hintState(i),used=S.hints[i]||0,c=CASES[i];
 const slot=k=>{if(used>k)return `<div class="memo"><div class="h">NOTE ${k+1}</div>${c.hints[k]}</div>`;
  const ready=k?r2:r1;if(!ready)return `<div class="memo locked">🔒 쪽지 ${k+1} — ${fmt((k?HINT2:HINT1)-t)} 뒤에 도착한다</div>`;
  if(k===1&&used<1)return `<div class="memo locked">쪽지 1을 먼저 읽어야 한다</div>`;
  return `<div class="memo locked"><button class="btn gold" data-h="${k}">쪽지 ${k+1} 읽기</button></div>`};
 openModal(`<h2 class="m-title">${EP.hintName}</h2><p class="m-sub">${EP.unitEn} ${pad(i+1)} · ${esc(c.title)}</p><div class="wat">${EP.hintSvg}<div>${slot(0)}${slot(1)}</div></div><p class="tip">${EP.hintNote}</p>`);
 $$('#ov [data-h]').forEach(b=>b.onclick=()=>{S.hints[i]=+b.dataset.h+1;save();AU.ding();openHints()});
}

/* ---------------- 사건 보드 ---------------- */
function openBoard(){
 const cards=CASES.map((c,i)=>{const done=S.solved[i]!==undefined;return `<button class="pinc ${done?'done':'no'}${i===S.stage?' now':''}" data-v="${i}"><span class="pin"></span><small>${EP.unitEn} ${pad(i+1)}</small><b>${done?esc(c.title):(i===S.stage?'수사 중':'???')}</b><span class="ans">${done?(c.icon||'')+' '+esc(S.solved[i]):'?'}</span></button>`}).join('');
 openModal(`<h2 class="m-title">사건 보드</h2><p class="m-sub">해결한 단서가 붉은 실로 이어진다 · 카드를 누르면 다시 볼 수 있다</p><div class="cork"><svg class="strings" id="strings"></svg><div class="pins">${cards}</div></div><p class="tip" style="margin-top:12px">탐정: <b>${esc(S.name)}</b> · 해결 ${Object.keys(S.solved).length} / ${N}</p>`,{wide:true});
 $$('#ov .pinc.done').forEach(b=>b.onclick=()=>viewCase(+b.dataset.v));
 requestAnimationFrame(drawStrings);
}
function drawStrings(){
 const svg=$('#strings');if(!svg)return;const box=svg.getBoundingClientRect();
 const pts=$$('#ov .pinc.done .pin').map(p=>{const r=p.getBoundingClientRect();return [r.left+r.width/2-box.left,r.top+r.height/2-box.top]});
 if(pts.length<2){svg.innerHTML='';return}
 let d='M'+pts[0].join(' ');for(let k=1;k<pts.length;k++){const [x0,y0]=pts[k-1],[x1,y1]=pts[k];d+=` Q${(x0+x1)/2} ${Math.max(y0,y1)+28} ${x1} ${y1}`}
 svg.innerHTML=`<path d="${d}" fill="none" stroke="#b3271d" stroke-width="2.4" stroke-linecap="round" style="filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))"/>`;
}
function viewCase(i){
 openModal(`<p class="m-sub">지난 단서 다시 보기</p>${caseMarkup(i,true)}<div style="text-align:center;margin-top:16px"><button class="btn" data-back>← 사건 보드로</button></div>`,{wide:true});
 wireCase($('#ov .modal'),true,i);$('#ov [data-back]').onclick=openBoard;
}
window.addEventListener('resize',()=>drawStrings());

/* ---------------- HUD ---------------- */
function updateHUD(){
 if(!S||!S.start)return;const el=((S.end||Date.now())-S.start)/1000,left=TOTAL-el;
 $('#clockfill').style.width=Math.max(0,left/TOTAL*100)+'%';
 $('#clocktime').textContent=left>=0?fmt(left):'+'+fmt(-left);
 $('#clockbar').classList.toggle('low',left<300);$('.clockbar .lbl').textContent=left<0?'연장 수사':EP.clockLbl;
 if(!S.end){if(left<600&&!S.w10){S.w10=1;save();toast(EP.warn10,3500);AU.ding()}AU.tense=left<300}
 const hb=$('#btnHint');if(S.stage<N){const i=S.stage,[r1,r2,t]=hintState(i),used=S.hints[i]||0;let txt,ready=false;
  if(used>=2)txt='모두 읽음';else if((used===0&&r1)||(used===1&&r2)){txt='도착!';ready=true}else txt=fmt((used===0?HINT1:HINT2)-t)+' 뒤';
  hb.innerHTML=`${IC.memo}${EP.hintName} <span class="t">${txt}</span>`;hb.classList.toggle('ready',ready)}
}
function setSndBtn(){$('#btnSnd').innerHTML=(AU.on?IC.sndOn:IC.sndOff)+(AU.on?'소리 켜짐':'소리 꺼짐')}

/* ---------------- 인트로 ---------------- */
function intro(){
 $('#hud').hidden=true;const saved=load(),I=EP.intro;
 $('#main').innerHTML=`<div class="intro"><div class="en">${EP.en}</div><h1>${EP.h1}</h1>
  ${saved?`<div style="margin-top:40px"><button class="btn gold" id="cont">${saved.end?EP.medal.again:'이어서 수사하기'} — ${esc(saved.name)}${saved.end?'':` (${EP.unit} ${pad(Math.min(saved.stage+1,N))})`}</button><p class="tip" style="color:#a8936a">다른 사람이 새로 시작하려면 선생님께 말씀드리세요.</p></div>`
  :`<div class="telegram ${I.cls||''}" id="tel"><div class="tt">${I.tag}</div><div class="ur">${I.stamp}</div><div class="to">${I.to}</div></div><p class="hintline">${I.hintline}</p>`}</div>`;
 $('.intro .en').addEventListener('click',teacherTap);
 const tel=$('#tel');if(tel){let opened=false;tel.onclick=()=>{if(opened)return;opened=true;AU.init();AU.morse();tel.classList.add('beep');setTimeout(()=>{AU.paper();letter()},1700)}}
 const c=$('#cont');if(c)c.onclick=()=>{AU.init();S=saved;setSndBtn();if(S.end)ending();else renderCase()};
}
let typeIv=0;
function typeInto(el,text,speed,done){const chars=[...text];let k=0;clearInterval(typeIv);
 typeIv=setInterval(()=>{k++;el.innerHTML=esc(chars.slice(0,k).join(''))+'<span class="caret"></span>';if(chars[k-1]&&chars[k-1].trim()&&k%2)AU.key();if(k>=chars.length){clearInterval(typeIv);el.innerHTML=esc(text);done&&done()}},speed);
 return ()=>{clearInterval(typeIv);el.innerHTML=esc(text);done&&done()}}
function letter(){
 const [L1,CARD,L2]=EP.intro.letter;
 $('#main').innerHTML=`<div class="letter"><div class="paper"><div class="typed" id="t1"></div><div class="mcard2" id="t2" hidden></div><div class="typed" id="t3"></div><button class="skip" id="skip">건너뛰기 ▸</button><div id="after" hidden></div></div></div>`;
 let done=false;const finishAll=()=>{if(done)return;done=true;clearInterval(typeIv);$('#t1').innerHTML=esc(L1);const c=$('#t2');c.hidden=false;c.innerHTML=esc(CARD).replace(/\n/g,'<br>');$('#t3').innerHTML=esc(L2)+`<span class="sig">— ${EP.intro.sig}</span>`;$('#skip')&&$('#skip').remove();AU.ding();showRules()};
 typeInto($('#t1'),L1,40,()=>{const c=$('#t2');c.hidden=false;AU.paper();flash();AU.thunder(.7);
  typeInto(c,CARD,52,()=>{c.innerHTML=esc(CARD).replace(/\n/g,'<br>');typeInto($('#t3'),L2,40,finishAll)})});
 $('#skip').onclick=finishAll;
}
function showRules(){
 const a=$('#after');if(!a.hidden)return;a.hidden=false;
 a.innerHTML=`<div class="rule"></div><h3 class="m-title" style="font-size:24px">탐정 수칙</h3><ul class="rules">
  <li><b class="n">1</b><span>모든 단서는 <b>혼자</b> 푼다. 친구에게 답을 묻거나 알려 주지 않는다.</span></li>
  <li><b class="n">2</b><span>${EP.rule2}</span></li>
  <li><b class="n">3</b><span>한 단서에서 <b>세 번</b> 틀리면 레스트레이드 경감이 잠시 막아선다.</span></li>
  <li><b class="n">4</b><span><b>${EP.hintName}</b>는 한 단서에 ${HINT1/60}분, ${HINT2/60}분이 지나야 도착하고, 아주 짧다. 스스로 생각하는 것이 먼저다.</span></li>
  <li><b class="n">5</b><span>그리거나 써 봐야 풀리는 단서가 있다. <b>✏️ 수첩</b>과 <b>🔍 돋보기</b>를 적극적으로 써라.</span></li>
  <li><b class="n">6</b><span>이어폰을 끼면 사건 현장의 소리가 들린다. 🎧</span></li></ul>
  <div class="namebox"><input id="nm" maxlength="20" placeholder="탐정 이름 (예: 12번 김탐정)" autocomplete="off"><button class="btn gold" id="go">🔍 수사 시작</button></div>`;
 const start=()=>{const n=$('#nm').value.trim();if(!n){toast('탐정 이름을 적어 주세요');$('#nm').focus();return}AU.init();S=blank();S.name=n;S.start=Date.now();save();setSndBtn();travel(CASES[0].place)};
 $('#go').onclick=start;$('#nm').addEventListener('keyup',e=>{if(e.key==='Enter'&&!e.isComposing)start()});
 setTimeout(()=>a.scrollIntoView({behavior:'smooth',block:'center'}),100);
}

/* ---------------- 엔딩 ---------------- */
function openFinale(){
 AU.setLevel(N,'victory');$('#btnHint').hidden=true;$('#chip').textContent=EP.medal.chip;$('#placeSm').textContent=EP.medal.placeSm;
 $('#main').innerHTML=`<section class="file"><div class="file-tab">CASE CLOSED</div><div class="paper" style="text-align:center"><div class="place" style="justify-content:center">${IC.pin}${EP.medal.place}</div><h1 class="c-title">${EP.medal.title}</h1>${EP.finaleSVG()}<div id="endtxt"></div></div></section>`;
 window.scrollTo({top:0,behavior:'smooth'});
 setTimeout(()=>{$('#fin').classList.add('open');AU.reveal()},600);
 setTimeout(()=>{AU.fanfare();finalStory()},2600);
}
function finalStory(){
 const txt=EP.finaleText(S.name);
 const out=$('#endtxt');out.innerHTML=`<div class="typed" id="et" style="text-align:left;max-width:600px;margin:14px auto 0"></div><button class="skip" id="eskip">건너뛰기 ▸</button>`;
 let done=false;const fin=()=>{if(done)return;done=true;$('#eskip')&&$('#eskip').remove();medal()};
 const stop=typeInto($('#et'),txt,34,fin);$('#eskip').onclick=stop;
}
function medal(){
 const M=EP.medal,sec=((S.end||Date.now())-S.start)/1000,hints=Object.values(S.hints).reduce((a,b)=>a+b,0),wr=S.totalWrong||0;
 const rank=hints<=1&&wr<=2?'셜록 홈즈급 명탐정':hints<=6?'왓슨 박사급 탐정':'베이커가 특공대 탐정';
 const div=document.createElement('div');
 div.innerHTML=`<div class="cert"><h2>${M.en}</h2><div class="kr">${M.kr}</div><div class="who">${esc(S.name)}</div><div class="rank">${rank}</div><p style="margin:6px 0;line-height:1.7">${M.desc}</p>
  <div class="stats"><div><small>수사 시간</small><b>${fmt(sec)}</b></div><div><small>${EP.hintName}</small><b>${hints}장</b></div><div><small>잘못된 추리</small><b>${wr}번</b></div></div>
  <p style="font-family:var(--display);font-style:italic;margin:0">Baker Street 221B, London</p><div class="wax">SH</div></div>
  <p class="tbc">${M.tail}</p>
  <p class="tip" style="font-size:15px;margin-top:10px">🏅 이 화면을 선생님께 보여 주세요.</p><button class="mini" id="eb">사건 보드 보기</button>`;
 $('#endtxt').appendChild(div);$('#eb').onclick=openBoard;updateHUD();
}
function ending(){
 $('#hud').hidden=false;AU.setLevel(N,'victory');$('#btnHint').hidden=true;$('#chip').textContent=EP.medal.chip;
 $('#main').innerHTML=`<section class="file"><div class="file-tab">CASE CLOSED</div><div class="paper" style="text-align:center"><h1 class="c-title">${EP.medal.title}</h1>${EP.finaleSVG()}<div id="endtxt"></div></div></section>`;
 $('#fin').classList.add('open');medal();updateHUD();
}

/* ---------------- 교사 메뉴 ---------------- */
let taps=[];
function teacherTap(){const n=Date.now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>=5){taps=[];teacherLogin()}}
function teacherLogin(){
 openModal(`<h2 class="m-title">교사 메뉴</h2><div class="namebox"><input id="tc" type="password" inputmode="numeric" placeholder="교사 코드" autocomplete="off"><button class="btn gold" id="tcGo">열기</button></div>`);
 const go=()=>{if(hx('teacher:'+$('#tc').value)===TCODE)teacherPanel();else toast('코드가 맞지 않습니다')};$('#tcGo').onclick=go;$('#tc').addEventListener('keyup',e=>{if(e.key==='Enter')go()});$('#tc').focus();
}
function teacherPanel(){
 openModal(`<h2 class="m-title">교사 메뉴</h2><p class="m-sub">진행 관리</p><p style="text-align:center">현재: ${S?esc(S.name)+' · '+EP.unit+' '+pad(Math.min(S.stage+1,N)):'시작 전'}</p>
 <p class="tip">단서로 바로 이동 (앞 단서는 '교사 이동'으로 기록됩니다)</p><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 16px">${CASES.map((c,i)=>`<button class="mini" style="margin:0" data-j="${i}">${i+1}</button>`).join('')}</div>
 <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="tUnlock">잠금 풀기</button><button class="btn" id="tHint">쪽지 즉시 도착</button><button class="btn red" id="tReset">처음부터 (새 학생)</button></div>`);
 $$('#ov [data-j]').forEach(b=>b.onclick=()=>{if(!S){S=blank();S.name='선생님';S.start=Date.now()}const j=+b.dataset.j;for(let k=0;k<j;k++)if(S.solved[k]===undefined)S.solved[k]='교사 이동';for(let k=j;k<N;k++)delete S.solved[k];S.stage=j;S.end=0;S.stageStart[j]=Date.now();S.lockUntil=0;save();AU.init();setSndBtn();closeModal();renderCase()});
 $('#tUnlock').onclick=()=>{if(S){S.lockUntil=Date.now();save()}closeModal();toast('잠금을 풀었습니다')};
 $('#tHint').onclick=()=>{if(S&&S.stage<N){S.stageStart[S.stage]=Date.now()-HINT2*1000;save();updateHUD()}closeModal();toast('이 단서의 쪽지가 모두 도착했습니다')};
 $('#tReset').onclick=()=>{if(!confirm('이 기기의 진행 기록을 모두 지우고 처음 화면으로 갑니다.'))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
}

/* ---------------- 비 ---------------- */
function rain(){
 const cv=$('#rain'),g=cv.getContext('2d');let W,H,drops=[];
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;drops=Array.from({length:Math.min(120,Math.floor(W/9))},()=>({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*16,v:7+Math.random()*7}))};
 rs();addEventListener('resize',rs);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const step=()=>{g.clearRect(0,0,W,H);g.strokeStyle=EP.rainColor||'rgba(170,190,205,.35)';g.lineWidth=1;g.beginPath();for(const d of drops){g.moveTo(d.x,d.y);g.lineTo(d.x-d.l*.18,d.y+d.l);d.y+=d.v;d.x-=d.v*.18;if(d.y>H){d.y=-20;d.x=Math.random()*W*1.1}}g.stroke();requestAnimationFrame(step)};step();
}

/* ---------------- 시작 ---------------- */
(function boot(){
 rain();setupPad();
 $('#logo').innerHTML=IC.logo(EP.logoN);$('#bigben').innerHTML=IC.clock;$('#brand').addEventListener('click',teacherTap);
 $('#btnBoard').innerHTML=IC.board+'사건 보드';$('#btnBoard').onclick=()=>{AU.click();openBoard()};
 $('#btnPad').innerHTML=IC.pad+'수첩';$('#btnPad').onclick=()=>{AU.click();$('#pad').hidden=false};
 $('#btnHint').onclick=()=>{AU.click();openHints()};
 AU.on=AU.pref();setSndBtn();$('#btnSnd').onclick=()=>{AU.init();AU.setSound(!AU.on);setSndBtn()};
 setInterval(updateHUD,1000);
 intro();
})();

</script>
